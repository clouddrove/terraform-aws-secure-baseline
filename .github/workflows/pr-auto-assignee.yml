---
name: Auto Assign PRs

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  pull_request:
    types: [opened, reopened]

  workflow_dispatch:

jobs:
  assignee:
    permissions:
      contents: read
      issues: write
      pull-requests: write

    uses: clouddrove/github-shared-workflows/.github/workflows/pr-auto-assignee.yml@v2

    secrets:
      GITHUB: ${{ secrets.GITHUB_TOKEN }}

    with:
      assignees: 'clouddrove-ci'
...